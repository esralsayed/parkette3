<svg width="400" height="400" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Background/Ground -->
  <rect width="32" height="32" fill="none" />

  <!-- Ladder Structure (Blue) -->
  <rect x="4" y="10" width="2" height="18" fill="#003E8F" /> 
  <rect x="8" y="10" width="2" height="18" fill="#003E8F" /> 

  <!-- Ladder Steps (Lilac) -->
  <rect x="6" y="14" width="2" height="2" fill="#E7E1FF" />
  <rect x="6" y="18" width="2" height="2" fill="#E7E1FF" />
  <rect x="6" y="22" width="2" height="2" fill="#E7E1FF" />
  <rect x="6" y="26" width="2" height="2" fill="#E7E1FF" />

  <!-- Top Platform & Ladder Support (Blue) -->
  <rect x="4" y="8" width="10" height="2" fill="#003E8F" />
  <rect x="6" y="6" width="6" height="2" fill="#003E8F" /> 

  <!-- Main Slide Structure (Blue) -->
  <rect x="12" y="10" width="4" height="4" fill="#003E8F" />
  <rect x="14" y="12" width="4" height="4" fill="#003E8F" />
  <rect x="16" y="14" width="4" height="4" fill="#003E8F" />
  <rect x="18" y="16" width="4" height="4" fill="#003E8F" />
  <rect x="20" y="18" width="4" height="4" fill="#003E8F" />
  <rect x="22" y="20" width="4" height="4" fill="#003E8F" />
  <rect x="24" y="22" width="6" height="4" fill="#003E8F" /> 

  <!-- Inside/Surface of Slide (Lilac) -->
  <rect x="12" y="10" width="2" height="2" fill="#E7E1FF" />
  <rect x="14" y="12" width="2" height="2" fill="#E7E1FF" />
  <rect x="16" y="14" width="2" height="2" fill="#E7E1FF" />
  <rect x="18" y="16" width="2" height="2" fill="#E7E1FF" />
  <rect x="20" y="18" width="2" height="2" fill="#E7E1FF" />
  <rect x="22" y="20" width="2" height="2" fill="#E7E1FF" />
  <rect x="24" y="22" width="4" height="2" fill="#E7E1FF" />
  
  <!-- Back Support Post (Blue) -->
  <rect x="18" y="20" width="2" height="8" fill="#003E8F" />

  <!-- **************************************** -->
  <!-- ADDED: Person Sliding (Matching Style) -->
  <!-- Located roughly halfway down the slide -->
  <!-- Uses 2x2 blocks to match standard 'pixel' size -->
  <!-- **************************************** -->
  <g id="sliding-person">
    <!-- Body/Shirt (Dark Blue #003E8F) -->
    <rect x="16" y="10" width="2" height="4" fill="#003E8F" />
    
    <!-- Head/Hair (Lilac #E7E1FF - to contrast shirt) -->
    <rect x="14" y="10" width="2" height="2" fill="#E7E1FF" />
    
    <!-- Legs (Dark Blue #003E8F) -->
    <rect x="18" y="12" width="2" height="2" fill="#003E8F" />
    <rect x="20" y="14" width="2" height="2" fill="#003E8F" />
  </g>
  
</svg>
